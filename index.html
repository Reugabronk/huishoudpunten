<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huishoudpunten</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Huishoudpunten">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f131b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232a78d6'/%3E%3Cpath fill='%23f2b824' d='M5 16h14l1.2-8-4.4 3.3L12 5.5 8.2 11.3 3.8 8z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: scorebord als vaste kop van het scherm, daaronder een raster van grote tik-rijen voor de tablet. */
:root {
  --bg: #eef1f6; --surface: #fbfcfe; --surface-2: #e4e9f1;
  --ink: #131a2a; --ink-2: #4a5468; --muted: #6f798c; --line: #d5dbe6;
  --p1: #2a78d6; --p2: #eb6834; --gold: #dc9c00; --danger: #c93636; --on-fill: #ffffff;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b; --surface: #181d28; --surface-2: #232a38;
    --ink: #eef1f6; --ink-2: #b9c1d0; --muted: #8e98aa; --line: #2e3646;
    --p1: #3987e5; --p2: #d95926; --gold: #f2b824; --danger: #e66767; --on-fill: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b; --surface: #181d28; --surface-2: #232a38;
  --ink: #eef1f6; --ink-2: #b9c1d0; --muted: #8e98aa; --line: #2e3646;
  --p1: #3987e5; --p2: #d95926; --gold: #f2b824; --danger: #e66767; --on-fill: #ffffff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)); -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 1080px; margin: 0 auto; }
.wrap, .stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button, .btn, nav a { transition: transform .3s cubic-bezier(.3, 1.7, .5, 1), background-color .2s, box-shadow .2s; }
button:active, label.btn:active { transform: scale(.93); transition-duration: .08s; }
.pop { animation: pop .5s cubic-bezier(.3, 1.5, .5, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes pop { from { opacity: 0; transform: scale(.82) translateY(12px); } }
.bump { animation: bump .55s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bump { 35% { transform: scale(1.3); } }
.row-in { animation: rowin .45s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes rowin { from { opacity: 0; transform: translateY(-14px) scale(.96); } }
.flash-pop { animation: presspop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes presspop { from { transform: scale(.9); } 55% { transform: scale(1.06); } }
@keyframes drain { from { transform: scaleY(1); } to { transform: scaleY(0); } }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 16px) scale(.9); } }
@media (prefers-reduced-motion: reduce) { .pop, .bump, .row-in, .flash-pop, .toast { animation: none !important; } button, .btn, nav a { transition: none; } }
.sec-head a, .empty a { color: inherit; }
:focus-visible { outline: 3px solid var(--p1); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
.p1 { --pc: var(--p1); } .p2 { --pc: var(--p2); }

/* kop */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.top .week { color: var(--ink-2); font-size: 15px; }
nav { display: flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 2px; }
nav a { text-decoration: none; color: var(--ink-2); font-weight: 500; padding: 10px 18px; border-radius: 999px; min-height: 44px; display: flex; align-items: center; }
nav a[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgb(0 0 0 / .12); }

.note { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; color: var(--ink-2); font-size: 15px; }

/* scorebord */
.score { background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.pl { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; text-align: center; }
.crown { height: 34px; display: flex; align-items: flex-end; }
.crown svg { width: 40px; height: 34px; fill: var(--gold); }
.lead.new .crown svg { animation: drop .6s cubic-bezier(.2,1.8,.4,1); }
@keyframes drop { from { transform: translateY(-14px) rotate(-12deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .lead.new .crown svg { animation: none; } }
.pl .name { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; max-width: 100%; }
.pl .name span:last-child { overflow-wrap: anywhere; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); flex: none; }
.pts { font-family: var(--display); font-weight: 800; font-size: clamp(56px, 11vw, 96px); line-height: 1; letter-spacing: -0.03em; }
.pl .sub { color: var(--muted); font-size: 15px; }
.mid { text-align: center; color: var(--ink-2); font-size: 15px; max-width: 150px; }
.mid b { display: block; font-family: var(--display); font-size: 20px; color: var(--ink); }
.balance { display: flex; gap: 2px; height: 12px; }
.balance i { display: block; height: 100%; background: var(--pc); border-radius: 6px; min-width: 6px; transition: flex-grow .4s; }
.balance.empty i { background: var(--surface-2); }

/* taken */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-head h2 { font-size: 22px; font-weight: 700; }
.sec-head p { margin: 0; color: var(--muted); font-size: 15px; }
.tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.task .t-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.task .t-name { font-weight: 700; font-size: 19px; overflow-wrap: anywhere; min-width: 0; }
.pill { flex: none; font-family: var(--display); font-weight: 700; background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.who { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .62fr) minmax(0, 1fr); gap: 8px; }
.who button.both { background: var(--surface-2); border-color: var(--line); padding-inline: 6px; }
.dot.duo { background: linear-gradient(90deg, var(--p1) 50%, var(--p2) 50%); }
.who button { min-height: 56px; border-radius: 14px; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; min-width: 0;
  background: color-mix(in srgb, var(--pc) 13%, var(--surface)); border: 2px solid color-mix(in srgb, var(--pc) 45%, var(--surface)); transition: transform .08s; }
.who button span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.who button { position: relative; overflow: hidden; }
.who button > * { position: relative; z-index: 1; }
.who button.done { border-color: var(--pc); }
.who button.both.done { border-color: var(--ink-2); }
.who button .fill { position: absolute; inset: 0; z-index: 0; background: var(--pc); transform-origin: bottom; animation: drain linear forwards; }
.who button.both .fill { background: linear-gradient(90deg, var(--p1) 50%, var(--p2) 50%); }
.who button.flash { border-style: solid; border-color: var(--pc); cursor: default; }
.who button.both.flash { border-color: var(--ink-2); }
.who button.flash .dot { background: var(--on-fill); }
.who .cnt { font-variant-numeric: tabular-nums; flex: none; }

/* lijsten */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row .time { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; flex: none; }
.row .plus { font-family: var(--display); font-weight: 700; flex: none; font-variant-numeric: tabular-nums; }
.btn { min-height: 44px; padding: 8px 16px; border-radius: 12px; background: var(--surface-2); font-weight: 500; flex: none; }
.btn.primary { background: var(--ink); color: var(--bg); font-weight: 700; }
.btn.danger { color: var(--danger); }
.btn.solid-danger { background: var(--danger); color: var(--on-fill); font-weight: 700; }
.empty { padding: 22px 16px; color: var(--muted); text-align: center; }

/* terugkijken */
.weekrow { width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 14px; border-top: 1px solid var(--line); min-height: 60px; }
.weekrow:first-child { border-top: 0; }
.weekrow:hover { background: var(--surface-2); }
.weekrow .wk b { display: block; font-family: var(--display); }
.weekrow .wk span { color: var(--muted); font-size: 14px; }
.weekrow .sc { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; min-width: 0; }
.weekrow .sc b { font-family: var(--display); font-size: 20px; }
.weekrow .sc svg { width: 20px; height: 17px; fill: var(--gold); flex: none; }
.weekrow .sc .nm { color: var(--ink-2); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { color: var(--muted); font-size: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h3 { font-size: 18px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--ink-2); font-size: 15px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--body); fill: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.chart text.val { fill: var(--ink-2); font-weight: 700; }
.chart text.today { fill: var(--ink); font-weight: 700; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--muted); stroke-width: 1; }
.chart .bar { fill: var(--pc); }
.chart .hit { fill: transparent; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 8px; font-size: 14px; transform: translate(-50%, -100%); white-space: nowrap; z-index: 2; }
.tot { display: grid; grid-template-columns: minmax(70px, auto) 1fr; gap: 10px 12px; align-items: center; }
.tot .nm { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.tot .nm svg { width: 20px; height: 17px; fill: var(--gold); }
.tot .track { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tot .track i { display: block; height: 26px; background: var(--pc); border-radius: 0 6px 6px 0; min-width: 3px; }
.tot .track b { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 12px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); }
thead th { border-top: 0; color: var(--muted); font-weight: 500; font-size: 14px; }
td.num, th.num { text-align: right; }
.alltime { display: flex; gap: 10px; flex-wrap: wrap; }
.alltime .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; display: flex; align-items: center; gap: 8px; }
.alltime svg { width: 20px; height: 17px; fill: var(--gold); }

/* beheer */
.field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.field label { font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
select { min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); padding: 6px 10px; font: inherit; color: inherit; max-width: 100%; }
input[type="text"] { width: 100%; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); padding: 8px 12px; min-width: 0; }
.names { display: flex; gap: 12px; flex-wrap: wrap; }
.names .field { flex: 1 1 220px; }
.step { display: flex; align-items: center; gap: 4px; flex: none; }
.step button { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); font-size: 22px; font-weight: 700; line-height: 1; }
.step output { width: 34px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.arow { flex-wrap: wrap; }
.arow input { flex: 1 1 200px; }
.addform { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.addform .field { flex: 1 1 220px; }
.group { background: var(--surface-2); border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.g-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.g-head .pill, .group .who button:not(.both) { background-color: var(--surface); }
.group .who button.both { background: var(--bg); }
.g-body { display: flex; flex-direction: column; gap: 12px; }
.g-toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; font-family: var(--display); font-weight: 700; font-size: 22px; text-align: left; min-width: 0; flex: 1; }
.g-toggle .g-name { overflow-wrap: anywhere; }
.g-toggle .tw { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 14px; transition: transform .35s cubic-bezier(.3, 1.7, .5, 1); }
.g-toggle[aria-expanded="false"] .tw { transform: rotate(-90deg); }
.g-all { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); align-items: center; gap: 12px; }
.g-all > span { color: var(--ink-2); font-size: 15px; }
.g-all .who { max-width: 560px; width: 100%; justify-self: end; }
.g-all .who button { border-style: dashed; }
.group .empty { padding: 8px; }
.grip { flex: none; width: 44px; height: 48px; border-radius: 12px; background: var(--surface-2); color: var(--muted); cursor: grab; touch-action: none; display: flex; align-items: center; justify-content: center; }
.grip svg { width: 18px; height: 22px; fill: currentColor; pointer-events: none; }
.dragging { background: color-mix(in srgb, var(--p1) 14%, var(--surface)); box-shadow: 0 6px 20px rgb(0 0 0 / .18); position: relative; z-index: 3; }
body.drag-on { user-select: none; -webkit-user-select: none; cursor: grabbing; }
.block { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.block[data-drag] { background: var(--surface-2); border-radius: 22px; padding: 12px; }
.block[data-drag] > .b-head .grip, .block[data-drag] > .b-head .btn { background: var(--surface); }
.b-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 48px; }
.b-head input { flex: 1 1 160px; font-weight: 700; }
.b-head .hint { color: var(--muted); font-size: 15px; }
.tasklist { min-height: 58px; }
.tasklist .drop-hint:not(:only-child) { display: none; }
.tasklist .row:first-child { border-top: 0; }
.tasklist .row { border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; z-index: 20; max-width: calc(100% - 32px); animation: toastin .4s cubic-bezier(.3, 1.5, .5, 1); }
.pin { align-self: center; width: min(100%, 340px); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 24px 20px; }
.pin h2 { font-size: 22px; } .pin p { margin: 0; color: var(--ink-2); font-size: 15px; }
.dots { display: flex; gap: 14px; padding: 6px 0; }
.dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); }
.dots i.on { background: var(--ink); border-color: var(--ink); }
.pinmsg { min-height: 22px; color: var(--danger); font-size: 15px; font-weight: 500; }
.keys { display: grid; grid-template-columns: repeat(3, 76px); gap: 12px; justify-content: center; }
.keys button { height: 68px; border-radius: 18px; background: var(--surface-2); font-family: var(--display); font-weight: 700; font-size: 26px; }
.keys button:active { transform: scale(.94); }
@media (max-width: 520px) {
  .g-all { grid-template-columns: 1fr; }
  .mid { grid-column: 1 / -1; grid-row: 2; max-width: none; }
  .duel { grid-template-columns: 1fr 1fr; }
  .weekrow { grid-template-columns: 1fr 1fr auto; }
  .weekrow .wk { grid-column: 1 / -1; }
  nav { width: 100%; } nav a { flex: 1; justify-content: center; padding: 10px 8px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Huishoudpunten</h1>
      <div class="week" id="weeklabel"></div>
    </div>
    <nav aria-label="Schermen">
      <a href="#" data-view="">Deze week</a>
      <a href="#terugkijken" data-view="terugkijken">Terugkijken</a>
      <a href="#beheer" data-view="beheer">Beheer</a>
    </nav>
  </header>
  <div id="banner" class="note" hidden></div>
  <main id="app" class="stack"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
  const CROWN = '<svg viewBox="0 0 24 20" aria-label="Loopt voorop"><path d="M3 15h18l1.6-10.5-5.8 4.3L12 1.5 7.2 8.8 1.4 4.5z"/><rect x="3" y="16.5" width="18" height="2.5" rx="1.2"/></svg>';
  const PIDS = ['p1', 'p2'];
  const DAYS = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
  const MONTHS = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const pt = (n) => n === 1 ? '1 punt' : `${n} punten`;

  function weekInfo(date) {
    const t = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const mon = addDays(t, -((t.getDay() + 6) % 7));
    const year = addDays(mon, 3).getFullYear();
    const w1 = week1Monday(year);
    const week = Math.round((mon - w1) / 6048e5) + 1;
    return { key: `${year}-W${pad(week)}`, year, week, mon };
  }
  function week1Monday(year) { const j = new Date(year, 0, 4); return addDays(j, -((j.getDay() + 6) % 7)); }
  function weekFromKey(key) {
    const [y, w] = key.split('-W').map(Number);
    return { key, year: y, week: w, mon: addDays(week1Monday(y), (w - 1) * 7) };
  }
  function rangeLabel(mon) {
    const sun = addDays(mon, 6);
    return mon.getMonth() === sun.getMonth()
      ? `${mon.getDate()}–${sun.getDate()} ${MONTHS[sun.getMonth()]}`
      : `${mon.getDate()} ${MONTHS[mon.getMonth()]} – ${sun.getDate()} ${MONTHS[sun.getMonth()]}`;
  }

  const state = {
    ready: false,
    names: { p1: 'Speler 1', p2: 'Speler 2' },
    tasks: [], groups: [], weekLog: [], logs: {}, open: {}, autoClose: 60, tickSecs: 3, flash: {}, justOpened: null, confirmDelG: null, dragging: false,
    cur: weekInfo(new Date()), today: dayKey(new Date()),
    hist: null, histLog: null, confirmDel: null, newPts: 1,

  function dayChart(log, mon) {

    const t = totals(log), l = leader(t), mx = Math.max(1, t.p1, t.p2);
    const legend = `<div class="legend">${PIDS.map((p) => `<span class="${p}"><span class="dot"></span>${esc(state.names[p])}</span>`).join('')}</div>`;
    const tot = PIDS.map((p) => `<div class="nm">${esc(state.names[p])}${l === p ? CROWN : ''}</div><div class="track ${p}"><i style="width:${(t[p] / mx) * 82}%"></i><b>${t[p]}</b></div>`).join('');
    const per = {};
    for (const e of log) { const r = per[e.name] || (per[e.name] = { p1: 0, p2: 0, pts: 0 }); if (e.who in r) r[e.who]++; r.pts += e.points || 0; }
    const names = Object.keys(per).sort((a, b) => per[b].pts - per[a].pts);
    const table = names.length ? `<div class="tablewrap"><table><thead><tr><th>Taak</th><th class="num">${esc(state.names.p1)}</th><th class="num">${esc(state.names.p2)}</th><th class="num">Punten</th></tr></thead>
      <tbody>${names.map((n) => `<tr><td>${esc(n)}</td><td class="num">${per[n].p1}×</td><td class="num">${per[n].p2}×</td><td class="num">${per[n].pts}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="empty">Deze week is er niets afgevinkt.</div>';
    const verdict = l ? `${esc(state.names[l])} ${isCur ? 'loopt voorop' : 'won'} met ${pt(Math.abs(t.p1 - t.p2))} verschil` : (t.p1 + t.p2 ? 'Gelijkspel' : 'Geen punten deze week');
    return `${head}
      <div class="panel"><h3>Punten per dag</h3>${legend}${dayChart(log, w.mon)}</div>
      <div class="two">
        <div class="panel"><h3>Hele week</h3><div class="tot">${tot}</div><div style="color:var(--ink-2)">${verdict}</div></div>
        <div class="panel"><h3>Wie deed wat</h3>${table}</div>
      </div>`;
  }

  function viewAdmin() {
    const taskRow = (t) => state.confirmDel === t.id
      ? `<div class="row arow"><span class="grow">“${esc(t.name)}” verwijderen? Eerder verdiende punten blijven staan.</span>
          <button class="btn solid-danger" data-act="del-yes" data-id="${esc(t.id)}">Verwijderen</button><button class="btn" data-act="del-no">Annuleren</button></div>`
      : `<div class="row arow" data-drag="task" data-id="${esc(t.id)}"><button class="grip" data-grip id="grip-${esc(t.id)}" aria-label="${esc(t.name)} verplaatsen: sleep, of gebruik pijl omhoog en omlaag">${GRIP}</button>
          <input type="text" id="tn-${esc(t.id)}" data-task="${esc(t.id)}" value="${esc(t.name)}" maxlength="60" aria-label="Naam van de taak">
          <div class="step" aria-label="Punten"><button data-act="pts" data-id="${esc(t.id)}" data-d="-1" aria-label="Minder punten">−</button><output>${t.points}</output><button data-act="pts" data-id="${esc(t.id)}" data-d="1" aria-label="Meer punten">+</button></div>
          <button class="btn danger" data-act="del" data-id="${esc(t.id)}">Verwijderen</button></div>`;
    const taskList = (gid) => `<div class="list tasklist" data-tasklist data-gid="${esc(gid)}">${tasksIn(gid).map(taskRow).join('')}<div class="empty drop-hint">Sleep een taak hierheen</div></div>`;
    const blocks = `<div class="block" data-block><div class="b-head"><b>Losse taken</b><span class="hint">niet in een map</span></div>${taskList('')}</div>`
      + sortedGroups().map((g) => `<div class="block" data-block data-drag="group" data-id="${esc(g.id)}"><div class="b-head">${state.confirmDelG === g.id
        ? `<span class="grow" style="flex:1 1 200px">Map “${esc(g.name)}” verwijderen? De taken blijven bestaan als losse taken.</span><button class="btn solid-danger" data-act="gdel-yes" data-id="${esc(g.id)}">Verwijderen</button><button class="btn" data-act="gdel-no">Annuleren</button>`
        : `<button class="grip" data-grip id="grip-${esc(g.id)}" aria-label="Map ${esc(g.name)} verplaatsen: sleep, of gebruik pijl omhoog en omlaag">${GRIP}</button>
           <input type="text" id="gn-${esc(g.id)}" data-gname="${esc(g.id)}" value="${esc(g.name)}" maxlength="40" aria-label="Naam van de map">
           <button class="btn danger" data-act="gdel" data-id="${esc(g.id)}">Map verwijderen</button>`}</div>${taskList(g.id)}</div>`).join('');
    if (!state.cfgReady) return '<div class="list"><div class="empty">Beheer laden…</div></div>';
    const wkeys = [...new Set([state.cur.key, ...Object.keys(state.logs).filter((k) => state.logs[k].length)])].sort().reverse();
    const fk = wkeys.includes(state.fixWeek) ? state.fixWeek : state.cur.key;
    const fixRows = (state.logs[fk] || []).filter((e) => !(e.pair && e.who === 'p2')).sort((a, b) => b.ts - a.ts).map((e) => {
      const d = new Date(e.ts), [yy, mm, dd] = String(e.day).split('-').map(Number), day = new Date(yy, mm - 1, dd), other = e.who === 'p1' ? 'p2' : 'p1';
      return `<div class="row arow ${e.pair ? '' : e.who}"><span class="time">${DAYS[(day.getDay() + 6) % 7]} ${dd} ${MONTHS[mm - 1]} · ${pad(d.getHours())}:${pad(d.getMinutes())}</span><span class="dot ${e.pair ? 'duo' : ''}"></span>
        <span class="grow"><b>${e.pair ? 'Samen' : esc(state.names[e.who] || '?')}</b> · ${esc(e.name)}</span><span class="plus">+${e.points}${e.pair ? ' ieder' : ''}</span>
        ${e.pair ? '' : `<button class="btn" data-act="fix-swap" data-id="${esc(e.id)}">Naar ${esc(state.names[other])}</button>`}
        <button class="btn danger" data-act="fix-del" data-id="${esc(e.id)}">Verwijderen</button></div>`;
    }).join('');
    const fix = `<div class="stack" style="gap:12px"><div class="sec-head"><h3>Afgevinkte taken corrigeren</h3>
        <select id="fix-week" aria-label="Week">${wkeys.map((k) => { const w = weekFromKey(k); return `<option value="${k}" ${k === fk ? 'selected' : ''}>Week ${w.week} · ${rangeLabel(w.mon)} ${w.year}${k === state.cur.key ? ' (nu)' : ''}</option>`; }).join('')}</select></div>
        <div class="list">${fixRows || '<div class="empty">In deze week is niets afgevinkt.</div>'}</div></div>`;
    if (state.pinStep === 'confirm') return pinPad('Herhaal de pincode', 'Voer dezelfde 4 cijfers nog een keer in.', !!state.pin);
    if (state.pinStep === 'set' || !state.pin) return pinPad(state.pin ? 'Kies een nieuwe pincode' : 'Kies een pincode voor Beheer', 'Vanaf nu is Beheer alleen te openen met deze 4 cijfers.', !!state.pin);
    if (!state.unlocked) return pinPad('Beheer is vergrendeld', 'Voer de pincode van 4 cijfers in.', false);
    return `
      <div class="sec-head"><h2>Beheer</h2><p>Wijzigingen worden direct opgeslagen</p></div>
      <div class="panel"><h3>Namen</h3><div class="names">
        ${PIDS.map((p) => `<div class="field ${p}"><label for="name-${p}"><span class="dot"></span>Speler ${p[1]}</label><input type="text" id="name-${p}" data-name="${p}" value="${esc(state.names[p])}" maxlength="24"></div>`).join('')}
      </div></div>
      <div class="two">
      <div class="panel"><h3>Nieuwe taak</h3><form class="addform" id="addform">
        <div class="field"><label for="new-name">Naam</label><input type="text" id="new-name" data-keep maxlength="60" placeholder="Bijvoorbeeld: ramen lappen"></div>
        <div class="field"><label for="new-group">Map</label><select id="new-group" data-keep style="min-height:48px"><option value="">Geen map</option>${sortedGroups().map((g) => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')}</select></div>
        <div class="field" style="flex:none"><label>Punten</label><div class="step"><button type="button" data-act="newpts" data-d="-1" aria-label="Minder punten">−</button><output>${state.newPts}</output><button type="button" data-act="newpts" data-d="1" aria-label="Meer punten">+</button></div></div>
        <button class="btn primary" type="submit" style="min-height:48px">Toevoegen</button>
      </form></div>
      <div class="panel"><h3>Nieuwe map</h3><form class="addform" id="groupform">
        <div class="field"><label for="new-group-name">Naam</label><input type="text" id="new-group-name" data-keep maxlength="40" placeholder="Bijvoorbeeld: keuken"></div>
        <button class="btn primary" type="submit" style="min-height:48px">Map toevoegen</button>
      </form></div>
      </div>
      <div class="stack" style="gap:12px"><div class="sec-head"><h3>Taken en mappen</h3><p>Sleep aan de zes puntjes om de volgorde te wijzigen of een taak in een andere map te zetten</p></div>
        ${blocks}</div>
      ${fix}
      <div class="panel"><h3>Aftik-timer</h3><div class="row" style="padding:0;border:0;flex-wrap:wrap"><label for="tick-secs" class="grow" style="color:var(--ink-2);flex:1 1 240px">Na een tik kleurt het vakje en loopt het in deze tijd leeg. Zolang kun je dat vakje niet nog een keer aantikken.</label>
        <select id="tick-secs">${[[1, '1 seconde'], [2, '2 seconden'], [3, '3 seconden'], [5, '5 seconden'], [10, '10 seconden'], [0, 'Uit']].map(([v, l]) => `<option value="${v}" ${v === state.tickSecs ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
      <div class="panel"><h3>Mappen vanzelf sluiten</h3><div class="row" style="padding:0;border:0;flex-wrap:wrap"><label for="auto-close" class="grow" style="color:var(--ink-2);flex:1 1 240px">Een geopende map op het hoofdscherm klapt weer dicht als er zo lang niets is aangetikt.</label>
        <select id="auto-close">${[[15, '15 seconden'], [30, '30 seconden'], [60, '1 minuut'], [120, '2 minuten'], [300, '5 minuten'], [0, 'Nooit']].map(([v, l]) => `<option value="${v}" ${v === state.autoClose ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
      <div class="panel"><h3>Pincode</h3><div class="row" style="padding:0;border:0"><span class="grow" style="color:var(--ink-2)">Beheer vergrendelt weer zodra je naar een ander scherm gaat.</span>
        <button class="btn" data-act="pin-change">Pincode wijzigen</button></div></div>
      <div class="panel"><h3>Back-up</h3><p style="margin:0;color:var(--ink-2)">Alle punten staan alleen in de browser van dit apparaat. Bewaar af en toe een back-up, of gebruik hem om naar een ander apparaat te verhuizen.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="export">Back-up downloaden</button>
        ${state.confirmImport ? '<span style="align-self:center">Dit vervangt alles op dit apparaat.</span><label class="btn solid-danger" for="import-file" style="display:flex;align-items:center;cursor:pointer">Bestand kiezen</label><button class="btn" data-act="import-no">Annuleren</button>' : '<button class="btn" data-act="import-ask">Back-up terugzetten</button>'}
        <input type="file" id="import-file" accept="application/json,.json" hidden></div></div>`;
  }

  function route() { const h = location.hash.replace('#', ''); return h === 'terugkijken' || h === 'beheer' ? h : ''; }
  function render() {
    if (state.dragging) return;
    const v = route();
    const act = document.activeElement, fid = act && act.id, pos = act && act.tagName === 'INPUT' ? [act.selectionStart, act.selectionEnd] : null;
    const keep = {}; document.querySelectorAll('[data-keep]').forEach((e) => { keep[e.id] = e.value; });
    $('weeklabel').textContent = `Week ${state.cur.week} · ${rangeLabel(state.cur.mon)}`;
    document.querySelectorAll('nav a').forEach((a) => a.dataset.view === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    $('app').innerHTML = v === 'beheer' ? viewAdmin() : v === 'terugkijken' ? viewHistory() : viewToday();
    for (const id in keep) if ($(id)) $(id).value = keep[id];
    const vkey = v + '|' + (state.hist || '') + '|' + (v === 'beheer' ? `${!!padOpen()}${state.pinStep || ''}` : '');
    if (vkey !== state.lastView) {
      if (state.lastView !== undefined && !RM) $('app').animate([{ opacity: 0, transform: 'translateY(16px) scale(.98)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: SPRING });
      state.lastView = vkey;
    }
    if (state.justOpened) {
      const sec = $('app').querySelector(`[data-gsec="${CSS.escape(state.justOpened)}"]`), body = sec && sec.querySelector('.g-body');
      state.justOpened = null;
      if (body && !RM) {
        body.style.overflow = 'hidden';
        body.animate([{ height: '0px', opacity: 0 }, { height: body.offsetHeight + 'px', opacity: 1 }], { duration: 460, easing: SPRING }).onfinish = () => { body.style.overflow = ''; };
        const tw = sec.querySelector('.tw'); if (tw) tw.animate([{ transform: 'rotate(-90deg)' }, { transform: 'rotate(0deg)' }], { duration: 420, easing: 'cubic-bezier(.3, 1.7, .5, 1)' });
      }
    }
    if (fid && $(fid) && $(fid) !== document.activeElement) { $(fid).focus(); if (pos) try { $(fid).setSelectionRange(pos[0], pos[1]); } catch (e) {} }
  }

  /* ---------- events ---------- */
  $('app').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    if (a === 'key') pressKey(b.dataset.k);
    else if (a === 'pin-change') { state.pinStep = 'set'; state.entry = ''; state.pinMsg = ''; render(); }
    else if (a === 'pin-cancel') { state.pinStep = null; state.entry = ''; state.pinMsg = ''; render(); }
    else if (a === 'fix-swap' || a === 'fix-del') {
      const key = $('fix-week') ? $('fix-week').value : state.cur.key;
      (a === 'fix-swap' ? swapEntry : dropEntry)(key, b.dataset.id);
    }
    else if (a === 'export') exportData();
    else if (a === 'import-ask') { state.confirmImport = true; render(); }
    else if (a === 'import-no') { state.confirmImport = false; render(); }
    else if (a === 'toggle') toggleGroup(b.dataset.id);
    else if (a === 'doall') { if (!flashing(b.dataset.key)) { startFlash(b.dataset.key); doAll(b.dataset.group, b.dataset.who); } }
    else if (a === 'gdel') { state.confirmDelG = b.dataset.id; render(); }
    else if (a === 'gdel-no') { state.confirmDelG = null; render(); }
    else if (a === 'gdel-yes') { state.confirmDelG = null; deleteGroup(b.dataset.id); }
    else if (a === 'do') { const t = state.tasks.find((x) => x.id === b.dataset.task); if (t && !flashing(b.dataset.key)) { startFlash(b.dataset.key); addEntry(t, b.dataset.who); } }
    else if (a === 'undo') removeEntry(b.dataset.id);
    else if (a === 'open') openWeek(b.dataset.key);
    else if (a === 'back') { state.hist = null; state.histLog = null; render(); }
    else if (a === 'pts') { const t = state.tasks.find((x) => x.id === b.dataset.id); if (t) { const n = Math.min(10, Math.max(1, t.points + Number(b.dataset.d))); if (n !== t.points) saveTask(t.id, { points: n }); } }
    else if (a === 'newpts') { state.newPts = Math.min(10, Math.max(1, state.newPts + Number(b.dataset.d))); render(); }
    else if (a === 'del') { state.confirmDel = b.dataset.id; render(); }
    else if (a === 'del-no') { state.confirmDel = null; render(); }
    else if (a === 'del-yes') { state.confirmDel = null; deleteTask(b.dataset.id); render(); }
  });
  $('app').addEventListener('change', (ev) => {
    const i = ev.target;
    if (i.id === 'tick-secs') { state.tickSecs = Number(i.value); persist(); return; }
    if (i.id === 'auto-close') { state.autoClose = Number(i.value); persist(); return; }
    if (i.id === 'fix-week') { state.fixWeek = i.value; render(); return; }
    if (i.id === 'import-file') { state.confirmImport = false; if (i.files[0]) importData(i.files[0]); else render(); return; }
    if (i.dataset.gname) { const name = i.value.trim(); const g = state.groups.find((x) => x.id === i.dataset.gname); if (name && g && name !== g.name) saveGroup(g.id, name); else if (g) i.value = g.name; }
    else if (i.dataset.task) { const name = i.value.trim(); const t = state.tasks.find((x) => x.id === i.dataset.task); if (name && t && name !== t.name) saveTask(t.id, { name }); else if (t) i.value = t.name; }
    else if (i.dataset.name) { const name = i.value.trim() || state.names[i.dataset.name]; if (name !== state.names[i.dataset.name]) saveNames({ ...state.names, [i.dataset.name]: name }); else i.value = name; }
  });
  $('app').addEventListener('submit', (ev) => {
    ev.preventDefault();
    if (ev.target.id === 'groupform') {
      const g = $('new-group-name').value.trim();
      if (!g) { toast('Geef de map eerst een naam.'); $('new-group-name').focus(); return; }
      $('new-group-name').value = ''; addGroup(g); return;
    }
    const name = $('new-name').value.trim();
    if (!name) { toast('Geef de taak eerst een naam.'); $('new-name').focus(); return; }
    $('new-name').value = ''; const p = state.newPts; state.newPts = 1;
    addTask(name, p, $('new-group').value);
  });

  /* ---------- slepen ---------- */
  let drag = null;
  $('app').addEventListener('pointerdown', (ev) => {
    const g = ev.target.closest('[data-grip]'); if (!g || drag) return;
    const row = g.closest('[data-drag]'); if (!row) return;
    ev.preventDefault();
    drag = { row, kind: row.dataset.drag, id: ev.pointerId };
    state.dragging = true; row.classList.add('dragging'); document.body.classList.add('drag-on');
    try { g.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  document.addEventListener('pointermove', (ev) => {
    if (!drag || ev.pointerId !== drag.id) return;
    const y = ev.clientY, row = drag.row;
    if (y < 70) window.scrollBy(0, -14); else if (y > window.innerHeight - 70) window.scrollBy(0, 14);
    const el = document.elementFromPoint(ev.clientX, y); if (!el) return;
    const tgt = el.closest(`[data-drag="${drag.kind}"]`);
    if (tgt && tgt !== row) {
      const r = tgt.getBoundingClientRect(), mid = r.top + r.height / 2;
      const rowFirst = row.compareDocumentPosition(tgt) & Node.DOCUMENT_POSITION_FOLLOWING;
      if (tgt.parentNode !== row.parentNode) tgt.parentNode.insertBefore(row, y < mid ? tgt : tgt.nextSibling);
      else if (rowFirst && y > mid) tgt.parentNode.insertBefore(row, tgt.nextSibling);
      else if (!rowFirst && y < mid) tgt.parentNode.insertBefore(row, tgt);
      return;
    }
    if (drag.kind !== 'task' || tgt) return;
    const block = el.closest('[data-block]'); if (!block) return;
    const list = block.querySelector('[data-tasklist]');
    if (el.closest('.b-head')) { if (list.firstElementChild !== row) list.prepend(row); }
    else if (!list.contains(row)) list.insertBefore(row, list.querySelector('.drop-hint'));
  });
  function dragEnd(ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    drag = null; state.dragging = false; document.body.classList.remove('drag-on');
    commitOrder();
  }
  document.addEventListener('pointerup', dragEnd);
  document.addEventListener('pointercancel', dragEnd);
  $('app').addEventListener('keydown', (ev) => {
    const g = ev.target.closest && ev.target.closest('[data-grip]');
    if (!g || (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown')) return;
    ev.preventDefault();
    const row = g.closest('[data-drag]'), up = ev.key === 'ArrowUp';
    const sib = up ? row.previousElementSibling : row.nextElementSibling;
    if (!sib || sib.dataset.drag !== row.dataset.drag) return;
    if (up) sib.before(row); else sib.after(row);
    commitOrder();
  });
  function showTip(ev) {
    const h = ev.target.closest && ev.target.closest('[data-tip]');
    document.querySelectorAll('.tip').forEach((t) => t.remove());
    if (!h) return;
    const tip = document.createElement('div'); tip.className = 'tip'; tip.textContent = h.dataset.tip;
    tip.style.left = `clamp(90px, ${h.dataset.tx * 100}%, calc(100% - 90px))`; tip.style.top = `${Math.max(0.12, h.dataset.ty) * 100}%`;
    h.closest('.chart').appendChild(tip);
  }
  $('app').addEventListener('pointerover', showTip);
  $('app').addEventListener('pointerdown', showTip);
  document.addEventListener('keydown', (ev) => {
    if (!padOpen() || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); pressKey(ev.key); }
    else if (ev.key === 'Backspace') { ev.preventDefault(); pressKey('back'); }
  });
  window.addEventListener('hashchange', () => { state.confirmDel = null; state.confirmDelG = null; state.confirmImport = false; state.unlocked = false; state.entry = ''; state.pinStep = null; state.pinMsg = ''; if (route() !== 'terugkijken') { state.hist = null; state.histLog = null; } render(); });

  function openWeek(key) { state.hist = key; state.histLog = state.logs[key] || []; render(); }
  function banner(msg) { const b = $('banner'); b.textContent = msg || ''; b.hidden = !msg; }
  window.addEventListener('storage', (ev) => { if (ev.key === KEY && ev.newValue) { try { apply(JSON.parse(ev.newValue)); render(); } catch (e) {} } });

  setInterval(() => {
    const now = new Date(), k = dayKey(now);
    if (k === state.today) return;
    state.today = k;
    const w = weekInfo(now);
    if (w.key !== state.cur.key) { state.cur = w; state.weekLog = state.logs[w.key] || (state.logs[w.key] = []); }
    render();
  }, 30000);

  load();
  render();
})();
</script>
</body>
</html>
